<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit day counter</title>
<!--
  HABIT DAY COUNTER (embed for Notion)
  ------------------------------------
  One self-contained file. No external fonts, scripts or trackers.
  It reads its settings from the link (URL parameters):

    ?start=2026-10-24   First day of the habit (YYYY-MM-DD). Required for a real count.
    &goal=66            Target length in days (7 to 365). Default 66.
    &mode=build         "build" (default) or "break".
    &habit=Morning run  Name shown next to the ring (max 40 characters).
    &theme=auto         "auto" (default, follows the device), "light" or "dark".
    &accent=A8842F      Accent colour as 6 hex digits, no #.

  Without ?start= the page shows a preview (day 12) so it never looks broken.
-->
<style>
  :root {
    --ink: #1f2a3a;
    --muted: #6b6558;
    --track: rgba(31, 42, 58, 0.16);
    --gold: #a8842f;
    --font: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ede6da;
      --muted: #a8a193;
      --track: rgba(237, 230, 218, 0.18);
      --gold: #d2b061;
    }
  }
  :root[data-theme="dark"] {
    --ink: #ede6da;
    --muted: #a8a193;
    --track: rgba(237, 230, 218, 0.18);
    --gold: #d2b061;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body {
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px 28px;
    padding: 18px 16px;
    min-height: 100vh;
  }

  .ring {
    position: relative;
    width: 168px;
    height: 168px;
    flex: 0 0 auto;
  }
  .ring svg { width: 100%; height: 100%; display: block; }

  .tick {
    stroke: var(--track);
    stroke-linecap: round;
    transition: stroke 0.35s ease;
    transition-delay: var(--d, 0ms);
  }
  .tick.on { stroke: var(--gold); }
  .tick.now { animation: breathe 2.4s ease-in-out 1.4s infinite; }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .centre {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .day {
    font-size: 54px;
    line-height: 1;
    font-weight: 600;
    font-variant-numeric: lining-nums;
    letter-spacing: -0.01em;
  }
  .of {
    margin-top: 4px;
    font-size: 17px;
    color: var(--muted);
  }

  .text { max-width: 24ch; }
  .habit {
    margin: 0 0 6px;
    font-size: 26px;
    line-height: 1.15;
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  .message {
    margin: 0;
    font-size: 18px;
    line-height: 1.4;
    color: var(--muted);
  }

  @media (max-width: 420px) {
    .text { text-align: center; max-width: 30ch; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tick { transition: none; }
    .tick.now { animation: none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="ring" role="img" id="ring">
      <svg viewBox="0 0 200 200" aria-hidden="true" id="ticks"></svg>
      <div class="centre" aria-hidden="true">
        <div class="day" id="day">0</div>
        <div class="of" id="of"></div>
      </div>
    </div>
    <div class="text">
      <h1 class="habit" id="habit"></h1>
      <p class="message" id="message"></p>
    </div>
  </main>

<script>
(function () {
  var root = document.documentElement;
  var params = new URLSearchParams(window.location.search);

  /* ---------- 1. Read and validate settings from the link ---------- */
  var goal = parseInt(params.get("goal"), 10);
  if (!(goal >= 7 && goal <= 365)) goal = 66;

  var mode = params.get("mode") === "break" ? "break" : "build";
  var habitName = (params.get("habit") || "").trim().slice(0, 40);

  var theme = params.get("theme");
  if (theme === "light" || theme === "dark") root.setAttribute("data-theme", theme);

  var accent = params.get("accent");
  if (accent && /^[0-9a-f]{6}$/i.test(accent)) root.style.setProperty("--gold", "#" + accent);

  /* ---------- 2. Work out which day the person is on ---------- */
  // Parse YYYY-MM-DD as a LOCAL date and reject impossible dates (e.g. 2026-02-31).
  function parseDate(str) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || "");
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3];
    var date = new Date(y, mo - 1, d);
    if (date.getFullYear() !== y || date.getMonth() !== mo - 1 || date.getDate() !== d) return null;
    return date;
  }

  var start = parseDate(params.get("start"));
  var preview = !start;
  var day;            // 1 on the start date itself
  var daysUntil = 0;  // only used when the start date is in the future

  if (preview) {
    day = 12;
  } else {
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    // Math.round absorbs the 23h/25h days around daylight saving changes.
    var diff = Math.round((today - start) / 86400000);
    if (diff < 0) { daysUntil = -diff; day = 0; } else { day = diff + 1; }
  }

  /* ---------- 3. Draw the ring: one tick per day (max 100 ticks) ---------- */
  var n = Math.min(goal, 100);
  var progress = Math.min(day / goal, 1);
  var filled = day <= 0 ? 0 : Math.max(1, Math.ceil(progress * n));
  var complete = day >= goal;

  var svg = document.getElementById("ticks");
  var NS = "http://www.w3.org/2000/svg";
  var spacing = (2 * Math.PI * 86) / n;
  var strokeW = Math.max(1.4, Math.min(3.2, spacing * 0.36));
  var ticks = [];

  for (var i = 0; i < n; i++) {
    var line = document.createElementNS(NS, "line");
    line.setAttribute("x1", "100");
    line.setAttribute("y1", "8");
    line.setAttribute("x2", "100");
    line.setAttribute("y2", "24");
    line.setAttribute("stroke-width", strokeW.toFixed(2));
    line.setAttribute("transform", "rotate(" + ((i * 360) / n).toFixed(3) + " 100 100)");
    line.setAttribute("class", "tick");
    line.style.setProperty("--d", Math.min(i * 16, 1400) + "ms");
    svg.appendChild(line);
    ticks.push(line);
  }

  // Fill after first paint so the ring "writes itself" once on load.
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      for (var k = 0; k < filled; k++) ticks[k].classList.add("on");
      if (filled > 0 && !complete) ticks[filled - 1].classList.add("now");
    });
  });

  /* ---------- 4. Write the text (textContent only, never innerHTML) ---------- */
  var heading = (mode === "break" ? "Breaking: " : "Building: ") + (habitName || "your habit");

  var message;
  if (preview) {
    message = "Preview. Add ?start=YYYY-MM-DD to the link to start your own count.";
  } else if (daysUntil > 0) {
    message = daysUntil === 1 ? "Starts tomorrow." : "Starts in " + daysUntil + " days.";
  } else if (complete) {
    message = "Goal of " + goal + " days reached. The count keeps going.";
  } else {
    var left = goal - day;
    var ratio = day / goal;
    var leftText = left === 1 ? "1 day to go." : left + " days to go.";
    if (day === 1) {
      message = mode === "break" ? "Day one without it. " + leftText : "Day one is done. " + leftText;
    } else if (ratio < 0.5) {
      message = "Early days. Showing up matters more than being perfect. " + leftText;
    } else if (ratio < 0.75) {
      message = "Past the halfway point. " + leftText;
    } else {
      message = "Nearly there. " + leftText;
    }
  }

  document.getElementById("day").textContent = day;
  document.getElementById("of").textContent = "of " + goal;
  document.getElementById("habit").textContent = heading;
  document.getElementById("message").textContent = message;

  document.getElementById("ring").setAttribute(
    "aria-label",
    daysUntil > 0
      ? "Starts in " + daysUntil + " days. Goal " + goal + " days."
      : "Day " + day + " of " + goal
  );
})();
</script>
</body>
</html>
